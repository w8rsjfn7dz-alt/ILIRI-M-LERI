<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Iliri Måleri" />
  <title>Iliri Måleri</title>
  <style>
    :root{
      --bg:#f4f4f4;
      --card:#ffffff;
      --text:#111111;
      --muted:#666666;
      --accent:#111111;
      --line:#dddddd;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{
      max-width:680px;
      margin:0 auto;
      padding:20px 16px 40px;
    }
    h1{
      font-size:30px;
      margin:8px 0 4px;
      text-align:center;
    }
    .subtitle{
      text-align:center;
      color:var(--muted);
      margin-bottom:20px;
    }
    .card{
      background:var(--card);
      border-radius:16px;
      padding:16px;
      margin-bottom:16px;
      box-shadow:0 2px 10px rgba(0,0,0,.06);
    }
    label{
      display:block;
      font-weight:600;
      margin:12px 0 6px;
    }
    input, textarea, select{
      width:100%;
      padding:13px 12px;
      border:1px solid var(--line);
      border-radius:12px;
      font-size:17px;
      background:#fff;
    }
    textarea{min-height:90px;resize:vertical}
    button{
      width:100%;
      padding:14px;
      border:0;
      border-radius:12px;
      font-size:17px;
      font-weight:700;
      margin-top:14px;
      background:var(--accent);
      color:white;
    }
    .secondary{
      background:#e9e9e9;
      color:#111;
    }
    .job{
      padding:12px 0;
      border-bottom:1px solid var(--line);
    }
    .job:last-child{border-bottom:0}
    .job strong{display:block;font-size:17px}
    .small{color:var(--muted);font-size:14px;margin-top:3px}
    .empty{color:var(--muted)}
    .photos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
    .photos img{width:100%;height:140px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
    .photo-label{font-size:14px;font-weight:700;margin-top:10px}
    .offer-box{background:#f7f7f7;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
    .offer-row{display:flex;justify-content:space-between;gap:12px;margin:6px 0}
    .offer-total{font-size:18px;font-weight:800;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
    .invoice-box{background:#f7f7f7;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
    .dashboard{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0 24px}
    .dash-btn{background:#fff;color:#111;border:1px solid var(--line);min-height:82px;font-size:16px;font-weight:750;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
    .dash-btn span{font-size:26px}
    .section-target{scroll-margin-top:12px}
    .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 16px}
    .danger{background:#fff;color:#111;border:1px solid #bbb}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ILIRI MÅLERI</h1>
    <div class="dashboard">
      <button class="dash-btn" onclick="goToSection('projectsSection')"><span>📁</span>Projektet</button>
      <button class="dash-btn" onclick="goToSection('clientsSection')"><span>👤</span>Klientët</button>
      <button class="dash-btn" onclick="goToSection('hoursSection')"><span>⏱️</span>Orët</button>
      <button class="dash-btn" onclick="goToSection('materialsSection')"><span>🎨</span>Materialet</button>
      <button class="dash-btn" onclick="goToSection('offersSection')"><span>📝</span>Ofertat</button>
      <button class="dash-btn" onclick="goToSection('invoicesSection')"><span>🧾</span>Faturat</button>
    </div>

    <div id="clientsSection" class="card section-target">
      <h2>Klientët</h2>
      <div id="clientsSummary" class="small">Klientët e regjistruar do të shfaqen këtu.</div>
    </div>

    <div id="hoursSection" class="card section-target">
      <h2>Orët</h2>
      <div id="hoursSummary" class="small">0 orë gjithsej</div>
    </div>

    <div id="materialsSection" class="card section-target">
      <h2>Materialet</h2>
      <div id="materialsSummary" class="small">0.00 kr gjithsej</div>
    </div>

    <div id="offersSection" class="card section-target">
      <h2>Ofertat</h2>
      <div id="offersSummary" class="small">0 oferta të ruajtura</div>
    </div>

    <div id="invoicesSection" class="card section-target">
      <h2>Faturat</h2>
      <div id="invoicesSummary" class="small">0 fatura të ruajtura</div>
    </div>

    <div class="subtitle">Aplikacioni im i punës · Versioni 13</div>

    <div class="card">
      <h2>Punë e re</h2>

      <label for="client">Emri i klientit</label>
      <input id="client" placeholder="p.sh. Anders Karlsson">

      <label for="phone">Telefoni</label>
      <input id="phone" type="tel" placeholder="07...">

      <label for="address">Adresa e punës</label>
      <input id="address" placeholder="Rruga dhe numri">

      <label for="type">Lloji i punës</label>
      <select id="type">
        <option value="">Zgjidh</option>
        <option>Lyerje e brendshme</option>
        <option>Lyerje e jashtme</option>
        <option>Spatulim / bredspackling</option>
        <option>Tapet</option>
        <option>Sprucim</option>
        <option>Tjetër</option>
      </select>

      <label for="status">Gjendja e projektit</label>
      <select id="status">
        <option value="Filloi">Filloi</option>
        <option value="Në proces">Në proces</option>
        <option value="Mbaroi">Mbaroi</option>
      </select>

      <label for="notes">Shënime</label>
      <textarea id="notes" placeholder="Çfarë duhet bërë..."></textarea>

      <button onclick="saveJob()">Ruaj projektin</button>
    </div>

    <div class="card">
      <h2>Projektet e mia</h2>
      <div id="jobs"></div>
      <button class="secondary" onclick="clearAll()">Fshi të gjitha</button>
    </div>
  </div>

  <script>
    function goToSection(id){
      const el = document.getElementById(id);
      if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    }

    function updateDashboard(){
      const jobs = getJobs();
      const clients = [...new Set(jobs.map(j => (j.client || "").trim()).filter(Boolean))];
      const totalHours = jobs.reduce((sum,j) =>
        sum + (j.hours || []).reduce((s,h) => s + Number(h.hours || 0), 0), 0);
      const totalMaterials = jobs.reduce((sum,j) =>
        sum + (j.materials || []).reduce((s,m) => s + Number(m.cost || 0), 0), 0);
      const offers = jobs.filter(j => j.offer && Number(j.offer.labourPrice || 0) >= 0).length;
      const invoices = jobs.filter(j => j.invoice && (j.invoice.number || j.invoice.date || j.invoice.dueDate)).length;

      const c = document.getElementById("clientsSummary");
      const h = document.getElementById("hoursSummary");
      const m = document.getElementById("materialsSummary");
      const o = document.getElementById("offersSummary");
      const i = document.getElementById("invoicesSummary");

      if(c) c.innerHTML = clients.length
        ? `<b>${clients.length}</b> klientë: ${clients.map(escapeHtml).join(", ")}`
        : "Nuk ka klientë ende.";
      if(h) h.innerHTML = `<b>${totalHours}</b> orë gjithsej`;
      if(m) m.innerHTML = `<b>${totalMaterials.toFixed(2)} kr</b> materiale gjithsej`;
      if(o) o.innerHTML = `<b>${offers}</b> oferta të ruajtura`;
      if(i) i.innerHTML = `<b>${invoices}</b> fatura të ruajtura`;
    }

    function getCompany(){
      return JSON.parse(localStorage.getItem("iliriMaleriCompany") || "{}");
    }

    function saveCompany(){
      const company = {
        name: document.getElementById("companyName").value.trim(),
        org: document.getElementById("companyOrg").value.trim(),
        address: document.getElementById("companyAddress").value.trim(),
        phone: document.getElementById("companyPhone").value.trim(),
        email: document.getElementById("companyEmail").value.trim(),
        payment: document.getElementById("companyPayment").value.trim()
      };
      localStorage.setItem("iliriMaleriCompany", JSON.stringify(company));
      alert("Të dhënat e firmës u ruajtën.");
    }

    function loadCompany(){
      const c = getCompany();
      document.getElementById("companyName").value = c.name || "";
      document.getElementById("companyOrg").value = c.org || "";
      document.getElementById("companyAddress").value = c.address || "";
      document.getElementById("companyPhone").value = c.phone || "";
      document.getElementById("companyEmail").value = c.email || "";
      document.getElementById("companyPayment").value = c.payment || "";
    }

    function getJobs(){
      return JSON.parse(localStorage.getItem("iliriMaleriJobs") || "[]");
    }

    function saveJobs(jobs){
      localStorage.setItem("iliriMaleriJobs", JSON.stringify(jobs));
    }

    function saveJob(){
      const client = document.getElementById("client").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const address = document.getElementById("address").value.trim();
      const type = document.getElementById("type").value;
      const status = document.getElementById("status").value;
      const notes = document.getElementById("notes").value.trim();

      if(!client){
        alert("Shkruaj emrin e klientit.");
        return;
      }

      const jobs = getJobs();
      jobs.unshift({
        id: Date.now(),
        client,
        phone,
        address,
        type,
        status,
        notes,
        createdAt: new Date().toLocaleString("sq-AL")
      });

      saveJobs(jobs);

      document.getElementById("client").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("address").value = "";
      document.getElementById("type").value = "";
      document.getElementById("status").value = "Filloi";
      document.getElementById("notes").value = "";

      loadCompany();
      updateDashboard();
      renderJobs();
      alert("Projekti u ruajt.");
    }

    const photoDB = {
      db: null,
      async open(){
        if(this.db) return this.db;
        this.db = await new Promise((resolve, reject) => {
          const req = indexedDB.open("IliriMaleriPhotos", 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if(!db.objectStoreNames.contains("photos")){
              const store = db.createObjectStore("photos", {keyPath:"id", autoIncrement:true});
              store.createIndex("jobId", "jobId", {unique:false});
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        return this.db;
      },
      async add(jobId, category, file){
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("photos", "readwrite");
          tx.objectStore("photos").add({
            jobId, category, blob:file, name:file.name, createdAt:Date.now()
          });
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      },
      async getByJob(jobId){
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("photos", "readonly");
          const idx = tx.objectStore("photos").index("jobId");
          const req = idx.getAll(jobId);
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      }
    };

    async function renderJobs(){
      const allJobs = getJobs();
      const searchEl = document.getElementById("projectSearch");
      const filterEl = document.getElementById("projectFilter");
      const q = (searchEl?.value || "").trim().toLowerCase();
      const statusFilter = filterEl?.value || "";
      const jobs = allJobs.filter(job => {
        const text = `${job.client || ""} ${job.address || ""} ${job.phone || ""} ${job.type || ""}`.toLowerCase();
        return (!q || text.includes(q)) && (!statusFilter || job.status === statusFilter);
      });
      const box = document.getElementById("jobs");

      if(!jobs.length){
        box.innerHTML = '<div class="empty">Nuk ke regjistruar ende asnjë projekt.</div>';
        updateDashboard();
        return;
      }

      const rendered = [];
      for (const job of jobs){
        const totalHours = (job.hours || []).reduce((sum, h) => sum + Number(h.hours || 0), 0);
        const totalMaterials = (job.materials || []).reduce((sum, m) => sum + Number(m.cost || 0), 0);
        const labourPrice = Number(job.offer?.labourPrice || 0);
        const vatRate = Number(job.offer?.vatRate || 0);
        const subtotal = labourPrice + totalMaterials;
        const vatAmount = subtotal * vatRate / 100;
        const grandTotal = subtotal + vatAmount;

        const photos = await photoDB.getByJob(job.id);
        const before = photos.filter(p => p.category === "para");
        const after = photos.filter(p => p.category === "pas");

        const beforeHtml = before.map(p => {
          const url = URL.createObjectURL(p.blob);
          return `<img src="${url}" alt="Foto para">`;
        }).join("");

        const afterHtml = after.map(p => {
          const url = URL.createObjectURL(p.blob);
          return `<img src="${url}" alt="Foto pas">`;
        }).join("");

        rendered.push(`
        <div class="job">
          <strong>${escapeHtml(job.client)}</strong>
          <div class="small">${escapeHtml(job.type || "Pa lloj pune")}</div>
          <div class="small">${escapeHtml(job.address || "")}</div>
          <div class="small">${escapeHtml(job.phone || "")}</div>

          <label style="margin-top:10px">Gjendja e projektit</label>
          <select onchange="updateStatus(${job.id}, this.value)">
            <option ${job.status === "Filloi" ? "selected" : ""}>Filloi</option>
            <option ${job.status === "Në proces" ? "selected" : ""}>Në proces</option>
            <option ${job.status === "Mbaroi" ? "selected" : ""}>Mbaroi</option>
          </select>

          <h3 style="margin-bottom:4px">Orët e punës</h3>
          <div class="small"><b>Orë gjithsej:</b> ${totalHours}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
            <input id="date-${job.id}" type="date">
            <input id="hours-${job.id}" type="number" min="0" step="0.5" placeholder="Orë">
          </div>
          <button class="secondary" onclick="addHours(${job.id})">Shto orët</button>
          <div style="margin-top:8px">
            ${(job.hours || []).map(h => `<div class="small">${escapeHtml(h.date)} — ${escapeHtml(h.hours)} orë</div>`).join("")}
          </div>

          <h3 style="margin-bottom:4px;margin-top:18px">Materialet & shpenzimet</h3>
          <div class="small"><b>Totali i materialeve:</b> ${totalMaterials.toFixed(2)} kr</div>
          <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:8px;margin-top:8px">
            <input id="material-${job.id}" placeholder="p.sh. Bojë muri">
            <input id="cost-${job.id}" type="number" min="0" step="0.01" placeholder="Kr">
          </div>
          <button class="secondary" onclick="addMaterial(${job.id})">Shto materialin</button>
          <div style="margin-top:8px">
            ${(job.materials || []).map(m => `<div class="small">${escapeHtml(m.name)} — ${Number(m.cost).toFixed(2)} kr</div>`).join("")}
          </div>

          <h3 style="margin-bottom:4px;margin-top:18px">Oferta</h3>
          <label>Çmimi i punës</label>
          <input id="labour-${job.id}" type="number" min="0" step="0.01" value="${labourPrice || ""}" placeholder="Kr">

          <label>TVSH</label>
          <select id="vat-${job.id}">
            <option value="0" ${vatRate === 0 ? "selected" : ""}>0%</option>
            <option value="25" ${vatRate === 25 ? "selected" : ""}>25%</option>
          </select>

          <button class="secondary" onclick="saveOffer(${job.id})">Ruaj ofertën</button>
          <button onclick="viewOffer(${job.id})">Shiko ofertën</button>

          <div class="offer-box">
            <div class="offer-row"><span>Puna</span><b>${labourPrice.toFixed(2)} kr</b></div>
            <div class="offer-row"><span>Materialet</span><b>${totalMaterials.toFixed(2)} kr</b></div>
            <div class="offer-row"><span>Nëntotali</span><b>${subtotal.toFixed(2)} kr</b></div>
            <div class="offer-row"><span>TVSH ${vatRate}%</span><b>${vatAmount.toFixed(2)} kr</b></div>
            <div class="offer-row offer-total"><span>Totali</span><span>${grandTotal.toFixed(2)} kr</span></div>
          </div>

          <h3 style="margin-bottom:4px;margin-top:18px">Fatura</h3>
          <label>Numri i faturës</label>
          <input id="invoice-number-${job.id}" value="${escapeHtml(job.invoice?.number || "")}" placeholder="p.sh. 2026-001">

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div>
              <label>Data e faturës</label>
              <input id="invoice-date-${job.id}" type="date" value="${escapeHtml(job.invoice?.date || "")}">
            </div>
            <div>
              <label>Afati i pagesës</label>
              <input id="invoice-due-${job.id}" type="date" value="${escapeHtml(job.invoice?.dueDate || "")}">
            </div>
          </div>

          <button class="secondary" onclick="saveInvoice(${job.id})">Ruaj faturën</button>
          <button onclick="viewInvoice(${job.id})">Shiko faturën</button>

          <div class="invoice-box">
            <div class="offer-row"><span>Numri</span><b>${escapeHtml(job.invoice?.number || "—")}</b></div>
            <div class="offer-row"><span>Data</span><b>${escapeHtml(job.invoice?.date || "—")}</b></div>
            <div class="offer-row"><span>Afati</span><b>${escapeHtml(job.invoice?.dueDate || "—")}</b></div>
            <div class="offer-row offer-total"><span>Totali</span><span>${grandTotal.toFixed(2)} kr</span></div>
          </div>

          <h3 style="margin-bottom:4px;margin-top:18px">Fotot e projektit</h3>

          <div class="photo-label">Foto PARA</div>
          <input id="before-${job.id}" type="file" accept="image/*" capture="environment" multiple>
          <button class="secondary" onclick="savePhotos(${job.id}, 'para')">Ruaj foto para</button>
          <div class="photos">${beforeHtml || '<div class="small">Nuk ka foto para.</div>'}</div>

          <div class="photo-label">Foto PAS</div>
          <input id="after-${job.id}" type="file" accept="image/*" capture="environment" multiple>
          <button class="secondary" onclick="savePhotos(${job.id}, 'pas')">Ruaj foto pas</button>
          <div class="photos">${afterHtml || '<div class="small">Nuk ka foto pas.</div>'}</div>

          <button class="danger" onclick="deleteJob(${job.id})">Fshi këtë projekt</button>
          <div class="small" style="margin-top:12px">${escapeHtml(job.createdAt)}</div>
          ${job.notes ? `<div class="small">${escapeHtml(job.notes)}</div>` : ""}
        </div>
      `);
      }

      box.innerHTML = rendered.join("");
      updateDashboard();
    }

    function updateStatus(id, newStatus){
      const jobs = getJobs();
      const job = jobs.find(j => j.id === id);
      if(!job) return;
      job.status = newStatus;
      saveJobs(jobs);
      renderJobs();
    }

    function addHours(id){
      const dateEl = document.getElementById(`date-${id}`);
      const hoursEl = document.getElementById(`hours-${id}`);
      const date = dateEl.value;
      const hours = Number(hoursEl.value);

      if(!date || !hours || hours <= 0){
        alert("Zgjidh datën dhe shkruaj sa orë ke punuar.");
        return;
      }

      const jobs = getJobs();
      const job = jobs.find(j => j.id === id);
      if(!job) return;

      job.hours = job.hours || [];
      job.hours.unshift({date, hours});
      saveJobs(jobs);
      renderJobs();
    }

    function addMaterial(id){
      const materialEl = document.getElementById(`material-${id}`);
      const costEl = document.getElementById(`cost-${id}`);
      const name = materialEl.value.trim();
      const cost = Number(costEl.value);

      if(!name || isNaN(cost) || cost < 0){
        alert("Shkruaj materialin dhe çmimin.");
        return;
      }

      const jobs = getJobs();
      const job = jobs.find(j => j.id === id);
      if(!job) return;

      job.materials = job.materials || [];
      job.materials.unshift({name, cost});
      saveJobs(jobs);
      renderJobs();
    }

    function viewOffer(id){
      const jobs = getJobs();
      const job = jobs.find(j => j.id === id);
      if(!job) return;

      const totalMaterials = (job.materials || []).reduce((sum, m) => sum + Number(m.cost || 0), 0);
      const labourPrice = Number(job.offer?.labourPrice || 0);
      const vatRate = Number(job.offer?.vatRate || 0);
      const subtotal = labourPrice + totalMaterials;
      const vatAmount = subtotal * vatRate / 100;
      const grandTotal = subtotal + vatAmount;

      const company = getCompany();

      const materialRows = (job.materials || []).length
        ? (job.materials || []).map(m => `
            <tr>
              <td>${escapeHtml(m.name)}</td>
              <td style="text-align:right">${Number(m.cost || 0).toFixed(2)} kr</td>
            </tr>`).join("")
        : `<tr><td>Materiale</td><td style="text-align:right">0.00 kr</td></tr>`;

      const html = `
<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ofertë - ${escapeHtml(job.client)}</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f4f4;color:#111}
.sheet{max-width:720px;margin:20px auto;background:white;padding:28px;border-radius:14px}
h1{margin:0 0 4px;font-size:28px}
.brand{font-weight:800;font-size:18px;margin-bottom:28px}
.meta{line-height:1.7;margin-bottom:22px}
table{width:100%;border-collapse:collapse;margin-top:16px}
td{padding:10px 0;border-bottom:1px solid #ddd}
.total{font-size:20px;font-weight:800}
.actions{display:flex;gap:10px;margin-top:24px}
button{padding:12px 16px;border:0;border-radius:10px;background:#111;color:white;font-size:16px}
@media print{body{background:white}.sheet{margin:0;max-width:none;border-radius:0}.actions{display:none}}
</style>
</head>
<body>
<div class="sheet">
  <div class="brand">${escapeHtml(company.name || "ILIRI MÅLERI")}</div>
  <div class="meta">
    ${company.org ? `<b>Org.nr:</b> ${escapeHtml(company.org)}<br>` : ""}
    ${company.address ? `${escapeHtml(company.address)}<br>` : ""}
    ${company.phone ? `${escapeHtml(company.phone)}<br>` : ""}
    ${company.email ? `${escapeHtml(company.email)}<br>` : ""}
  </div>
  <h1>OFERTË</h1>
  <div class="meta">
    <b>Klienti:</b> ${escapeHtml(job.client)}<br>

    async function savePhotos(id, category){
      const input = document.getElementById(`${category === "para" ? "before" : "after"}-${id}`);
      const files = Array.from(input.files || []);
      if(!files.length){
        alert("Zgjidh të paktën një foto.");
        return;
      }

      try{
        for(const file of files){
          await photoDB.add(id, category, file);
        }
        input.value = "";
        await renderJobs();
        alert("Fotot u ruajtën.");
      }catch(e){
        console.error(e);
        alert("Fotot nuk u ruajtën. Provo përsëri.");
      }
    }

    function deleteJob(id){
      if(!confirm("Ta fshij këtë projekt?")) return;
      const jobs = getJobs().filter(j => j.id !== id);
      saveJobs(jobs);
      renderJobs();
    }

    function clearAll(){
      if(confirm("T'i fshij të gjitha projektet?")){
        localStorage.removeItem("iliriMaleriJobs");
        renderJobs();
      }
    }

    function escapeHtml(text){
      return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
