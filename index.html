<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ILIRI Måleri</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#111; --muted:#6b7280; --line:#d1d5db; --accent:#111827; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{font-size:20px;margin:0}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  label{font-size:13px;color:var(--muted);display:block;margin:8px 0 5px}
  input,select,textarea,button{font:inherit}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}
  textarea{min-height:90px;resize:vertical}
  button{border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:600}
  button.secondary{background:#e5e7eb;color:#111}
  button.danger{background:#b91c1c}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row button{flex:1}
  .project{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#fff}
  .project h3{margin:0 0 6px;font-size:17px}
  .meta{font-size:13px;color:var(--muted);line-height:1.5}
  .empty{color:var(--muted);text-align:center;padding:18px}
  .top-actions{display:flex;gap:8px}
  .top-actions button{padding:8px 10px}
  .badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2ff;font-size:12px;margin-top:6px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat b{display:block;font-size:20px}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <h1 id="appTitle">ILIRI Måleri</h1>
  <div class="top-actions">
    <button class="secondary" id="langBtn" type="button">SV</button>
    <button class="secondary" id="exportBtn" type="button">Backup</button>
  </div>
</header>

<div class="wrap">
  <div class="stats">
    <div class="stat"><b id="countAll">0</b><span id="lblAll">Projekte</span></div>
    <div class="stat"><b id="countActive">0</b><span id="lblActive">Aktive</span></div>
    <div class="stat"><b id="countDone">0</b><span id="lblDone">Mbaruar</span></div>
  </div>

  <section class="card">
    <h2 id="formTitle" style="margin-top:0">Projekt i ri</h2>
    <input type="hidden" id="projectId" />
    <div class="grid">
      <div><label id="lName">Klienti</label><input id="name" autocomplete="name" /></div>
      <div><label id="lPhone">Telefoni</label><input id="phone" inputmode="tel" /></div>
      <div><label id="lAddress">Adresa</label><input id="address" /></ <div><label id="lType">Lloji i punës</label><input id="type" placeholder="Målning, spackling..." /></div>
    <div>
      <div>

<label id="lType">Lloji i punës</label>

<select id="type">

<option value="">Zgjidh llojin e punës</option>

<option>Målning 1 </option>

<option>Spackling</option>

<option>Bredspackling</option>

<option>Tapetsering</option>

<option>Sprutmålning</option>

<option>Fasadmålning</option>

<option>Fönstermålning</option>

<option>Snickerimålning</option>

<option>Takmålning</option>

<option>Renoveringsmålning</option>

<option>Annat</option>

</select>

</div>

</div>  <div><label id="lStatus">Statusi</label><select id="status"><option value="active">Aktiv</option><option value="waiting">Në pritje</option><option value="done">Mbaruar</option></select></div>
      <div><label id="lHours">Orë pune</label><input id="hours" type="number" min="0" step="0.5" /></div>
      <div><label id="lMaterial">Materiale (kr)</label><input id="materials" type="number" min="0" step="1" /></div>
      <div><label id="lPrice">Çmimi / oferta (kr)</label><input id="price" type="number" min="0" step="1" /></div>
    </div>
    <label id="lNotes">Shënime</label><textarea id="notes"></textarea>
    <div class="row" style="margin-top:12px">
      <button id="saveBtn" type="button">Ruaj projektin</button>
      <button id="cancelBtn" class="secondary hidden" type="button">Anulo ndryshimin</button>
    </div>
  </section>

  <section class="card">
    <div class="grid">
      <div><label id="lSearch">Kërko</label><input id="search" placeholder="Emër, telefon, adresë..." /></div>
      <div><label id="lFilter">Filtro</label><select id="filter"><option value="all">Të gjitha</option><option value="active">Aktive</option><option value="waiting">Në pritje</option><option value="done">Mbaruar</option></select></div>
    </div>
    <div id="projects"></div>
  </section>

  <section class="card">
    <h2 id="backupTitle" style="margin-top:0">Rikthe backup</h2>
    <input id="importFile" type="file" accept="application/json" />
  </section>
</div>

<script>
const STORAGE_KEY = 'iliri_maleri_projects_v2';
const LANG_KEY = 'iliri_maleri_lang_v2';
let projects = loadProjects();
let lang = localStorage.getItem(LANG_KEY) || 'sq';

const $ = id => document.getElementById(id);

const T = {
  sq:{langBtn:'SV',all:'Projekte',active:'Aktive',done:'Mbaruar',form:'Projekt i ri',client:'Klienti',phone:'Telefoni',address:'Adresa',type:'Lloji i punës',status:'Statusi',hours:'Orë pune',materials:'Materiale (kr)',price:'Çmimi / oferta (kr)',notes:'Shënime',save:'Ruaj projektin',cancel:'Anulo ndryshimin',search:'Kërko',filter:'Filtro',backup:'Rikthe backup',empty:'Nuk ka projekte.',edit:'Ndrysho',del:'Fshi',confirm:'Ta fshij këtë projekt?',saved:'Projekti u ruajt.',updated:'Projekti u përditësua.',waiting:'Në pritje',allOpt:'Të gjitha',activeOpt:'Aktiv',doneOpt:'Mbaruar'},
  sv:{langBtn:'SQ',all:'Projekt',active:'Aktiva',done:'Klara',form:'Nytt projekt',client:'Kund',phone:'Telefon',address:'Adress',type:'Typ av arbete',status:'Status',hours:'Arbetstimmar',materials:'Material (kr)',price:'Pris / offert (kr)',notes:'Anteckningar',save:'Spara projekt',cancel:'Avbryt ändring',search:'Sök',filter:'Filtrera',backup:'Återställ backup',empty:'Inga projekt.',edit:'Redigera',del:'Radera',confirm:'Radera projektet?',saved:'Projektet sparades.',updated:'Projektet uppdaterades.',waiting:'Väntar',allOpt:'Alla',activeOpt:'Aktiv',doneOpt:'Klar'}
};

function loadProjects(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}
function persist(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); }
function esc(s=''){ return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function money(v){ return v ? Number(v).toLocaleString('sv-SE')+' kr' : '0 kr'; }
function statusLabel(v){ const t=T[lang]; return v==='active'?t.activeOpt:v==='waiting'?t.waiting:t.doneOpt; }

function saveProject(){
  const id = $('projectId').value;
  const item = {
    id: id || (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString()),
    name:$('name').value.trim(), phone:$('phone').value.trim(), address:$('address').value.trim(),
    type:$('type').value.trim(), status:$('status').value, hours:Number($('hours').value||0),
    materials:Number($('materials').value||0), price:Number($('price').value||0), notes:$('notes').value.trim(),
    updatedAt:new Date().toISOString()
  };
  if(!item.name){ $('name').focus(); return; }
  const i = projects.findIndex(p=>p.id===item.id);
  const editing = i>=0;
  if(editing) projects[i]=item; else projects.unshift(item);
  persist();
  clearForm();
  render();
  alert(editing ? T[lang].updated : T[lang].saved);
}

function editProject(id){
  const p=projects.find(x=>x.id===id); if(!p)return;
  $('projectId').value=p.id; $('name').value=p.name||''; $('phone').value=p.phone||''; $('address').value=p.address||'';
  $('type').value=p.type||''; $('status').value=p.status||'active'; $('hours').value=p.hours||''; $('materials').value=p.materials||'';
  $('price').value=p.price||''; $('notes').value=p.notes||'';
  $('cancelBtn').classList.remove('hidden'); $('formTitle').textContent = lang==='sq'?'Ndrysho projektin':'Redigera projekt';
  window.scrollTo({top:0,behavior:'smooth'});
}
function deleteProject(id){ if(confirm(T[lang].confirm)){ projects=projects.filter(p=>p.id!==id); persist(); render(); } }
function clearForm(){
  ['projectId','name','phone','address','type','hours','materials','price','notes'].forEach(id=>$(id).value='');
  $('status').value='active'; $('cancelBtn').classList.add('hidden'); $('formTitle').textContent=T[lang].form;
}

function render(){
  const q=$('search').value.toLowerCase().trim(), f=$('filter').value;
  const list=projects.filter(p=>(f==='all'||p.status===f) && [p.name,p.phone,p.address,p.type,p.notes].join(' ').toLowerCase().includes(q));
  $('projects').innerHTML = list.length ? list.map(p=>`<div class="project">
    <h3>${esc(p.name)}</h3>
    <div class="meta">${esc(p.phone||'')} ${p.phone&&p.address?'•':''} ${esc(p.address||'')}</div>
    <div class="meta">${esc(p.type||'')} ${p.type?'•':''} ${statusLabel(p.status)}</div>
    <div class="meta">${T[lang].hours}: ${p.hours||0} • ${T[lang].materials}: ${money(p.materials)} • ${T[lang].price}: ${money(p.price)}</div>
    ${p.notes?`<div style="margin-top:8px">${esc(p.notes)}</div>`:''}
    <span class="badge">${statusLabel(p.status)}</span>
    <div class="row" style="margin-top:10px"><button class="secondary" onclick="editProject('${p.id}')">${T[lang].edit}</button><button class="danger" onclick="deleteProject('${p.id}')">${T[lang].del}</button></div>
  </div>`).join('') : `<div class="empty">${T[lang].empty}</div>`;
  $('countAll').textContent=projects.length;
  $('countActive').textContent=projects.filter(p=>p.status==='active').length;
  $('countDone').textContent=projects.filter(p=>p.status==='done').length;
}

function applyLang(){
  const t=T[lang];
  $('langBtn').textContent=t.langBtn; $('lblAll').textContent=t.all; $('lblActive').textContent=t.active; $('lblDone').textContent=t.done;
  $('formTitle').textContent=$('projectId').value?(lang==='sq'?'Ndrysho projektin':'Redigera projekt'):t.form;
  $('lName').textContent=t.client; $('lPhone').textContent=t.phone; $('lAddress').textContent=t.address; $('lType').textContent=t.type;
  $('lStatus').textContent=t.status; $('lHours').textContent=t.hours; $('lMaterial').textContent=t.materials; $('lPrice').textContent=t.price;
  $('lNotes').textContent=t.notes; $('saveBtn').textContent=t.save; $('cancelBtn').textContent=t.cancel; $('lSearch').textContent=t.search;
  $('lFilter').textContent=t.filter; $('backupTitle').textContent=t.backup;
  $('filter').options[0].text=t.allOpt; $('filter').options[1].text=t.activeOpt; $('filter').options[2].text=t.waiting; $('filter').options[3].text=t.doneOpt;
  $('status').options[0].text=t.activeOpt; $('status').options[1].text=t.waiting; $('status').options[2].text=t.doneOpt;
  document.documentElement.lang=lang;
  localStorage.setItem(LANG_KEY,lang); render();
}

function exportBackup(){
  const blob=new Blob([JSON.stringify({version:2,projects},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='iliri-maleri-backup.json'; a.click(); URL.revokeObjectURL(a.href);
}
function importBackup(file){
  const r=new FileReader(); r.onload=()=>{ try{ const data=JSON.parse(r.result); const arr=Array.isArray(data)?data:data.projects; if(!Array.isArray(arr)) throw 0; projects=arr; persist(); render(); alert('OK'); }catch{ alert('Backup i pavlefshëm / Ogiltig backup'); } }; r.readAsText(file);
}

$('saveBtn').addEventListener('click',saveProject);
$('cancelBtn').addEventListener('click',clearForm);
$('search').addEventListener('input',render);
$('filter').addEventListener('change',render);
$('langBtn').addEventListener('click',()=>{lang=lang==='sq'?'sv':'sq';applyLang();});
$('exportBtn').addEventListener('click',exportBackup);
$('importFile').addEventListener('change',e=>{if(e.target.files[0])importBackup(e.target.files[0]);});

applyLang();
</script>
</body>
</html>
