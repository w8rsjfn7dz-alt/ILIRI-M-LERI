<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ILIRI Måleri">
<meta name="theme-color" content="#16a34a">
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--line:#d1d5db;--green:#16a34a;--soft:#eef2f7}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:21px;margin:0}.wrap{max-width:900px;margin:0 auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}.menu button{min-height:82px;font-size:17px}.menu .wide{grid-column:1/-1}
button{border:0;border-radius:12px;padding:12px 14px;background:var(--green);color:#fff;font-weight:700;font:inherit}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#b91c1c}.top-actions{display:flex;gap:8px}.top-actions button{padding:9px 11px}
.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.grid{grid-template-columns:1fr}}
label{font-size:13px;color:var(--muted);display:block;margin:9px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.section-title h2{margin:0;font-size:22px}
.item{border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:10px;background:#fff}.item h3{margin:0 0 6px;font-size:17px}.meta{font-size:13px;color:var(--muted);line-height:1.55}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;margin-top:7px}.clickable{cursor:pointer}.detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.statline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.stat.clickable{cursor:pointer;transition:transform .08s ease}.stat.clickable:active{transform:scale(.98)}.empty{color:var(--muted);text-align:center;padding:18px}.offer-tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.offer-line{display:grid;grid-template-columns:2fr .8fr 1fr auto;gap:7px;align-items:end;margin-top:8px}.offer-line.material-line{grid-template-columns:2fr .8fr 1fr auto}.offer-line button{padding:11px}.totalbox{background:var(--soft);border-radius:12px;padding:12px;margin-top:12px;line-height:1.7}.offer-status{font-weight:700}.main-offer{background:#0f7a37!important;font-size:19px!important;min-height:92px!important}@media(max-width:640px){.offer-line,.offer-line.material-line{grid-template-columns:1fr 1fr}.offer-line .desc,.offer-line.material-line .desc{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <h1>ILIRI Måleri</h1>
  <div class="top-actions"><button class="secondary" id="langBtn" type="button">SV</button><button class="secondary" id="backupBtn" type="button">Backup</button></div>
</header>
<div class="wrap">
  <section id="homeView">
    <div class="menu">
      <button id="btnOffers" class="wide main-offer" type="button">OFERTA</button>
      <button id="btnProjects" type="button">Projektet</button>
      <button id="btnClients" type="button">Klientët</button>
      <button id="btnHours" type="button">Orët</button>
      <button id="btnMaterials" type="button">Materialet</button>
      <button id="btnNewProject" class="wide" type="button">+ Projekt i ri</button>
    </div>
    <div class="statline">
      <div class="stat clickable" id="statProjectsCard"><b id="countProjects">0</b><span id="statProjects">Projekte</span></div>
      <div class="stat clickable" id="statClientsCard"><b id="countClients">0</b><span id="statClients">Klientë</span></div>
      <div class="stat clickable" id="statHoursCard"><b id="countHours">0</b><span id="statHours">Orë</span></div>
    </div>
  </section>

  <section id="projectFormView" class="hidden card">
    <div class="section-title"><h2 id="projectFormTitle">Projekt i ri</h2><button class="secondary backBtn" type="button">Kthehu</button></div>
    <input type="hidden" id="projectId">
    <div class="grid">
      <div><label id="lblProjectName">Emri i projektit</label><input id="projectName" placeholder="p.sh. Kallebäck 28"></div>
      <div><label id="lblProjectNumber">Numri i projektit</label><input id="projectNumber" placeholder="p.sh. 2026-001"></div>
      <div><label id="lblClient">Klienti</label><input id="clientName"></div>
      <div><label id="lblPhone">Telefoni</label><input id="phone" inputmode="tel"></div>
      <div><label id="lblAddress">Adresa</label><input id="address"></div>
      <div><label id="lblType">Lloji i punës</label><select id="type">
        <option value="">Zgjidh llojin e punës</option>
        <option>Målning</option><option>Spackling</option><option>Bredspackling</option><option>Tapetsering</option><option>Sprutmålning</option><option>Fasadmålning</option><option>Fönstermålning</option><option>Snickerimålning</option><option>Takmålning</option><option>Renoveringsmålning</option><option>Annat</option>
      </select></div>
      <div><label id="lblStatus">Statusi</label><select id="status"><option value="active">Aktiv</option><option value="waiting">Në pritje</option><option value="done">Mbaruar</option></select></div>
      <div><label id="lblPrice">Çmimi / oferta (kr)</label><input id="price" type="number" min="0" step="1"></div>
    </div>
    <label id="lblNotes">Shënime</label><textarea id="notes"></textarea>
    <div class="row" style="margin-top:12px"><button id="saveProjectBtn" type="button">Ruaj projektin</button><button id="cancelProjectBtn" class="secondary" type="button">Anulo</button></div>
    <button id="deleteCurrentProjectBtn" class="danger hidden" type="button" style="width:100%;margin-top:10px">Fshi projektin</button>
  </section>

  <section id="projectsView" class="hidden card">
    <div class="section-title"><h2 id="projectsTitle">Projektet</h2><button class="secondary backBtn" type="button">Kthehu</button></div>
    <label id="lblSearchProject">Kërko projekt</label><input id="projectSearch" placeholder="Emër ose numër projekti...">
    <div id="projectsList"></div>
  </section>

  <section id="clientsView" class="hidden card">
    <div class="section-title"><h2 id="clientsTitle">Klientët</h2><button class="secondary backBtn" type="button">Kthehu</button></div>
    <label id="lblSearchClient">Kërko klient</label><input id="clientSearch" placeholder="Emri i klientit...">
    <div id="clientsList"></div>
  </section>

  <section id="hoursView" class="hidden card">

      <div><label id="lblOfferStatus">Statusi</label><select id="offerStatus"><option value="sent">E dërguar</option><option value="accepted">E pranuar</option><option value="paid">E paguar</option></select></div>
    </div>

    <h3 id="materialLinesTitle" style="margin-top:18px">Materialet</h3><div id="materialLines"></div><button id="addMaterialLineBtn" class="secondary" type="button" style="width:100%;margin-top:8px">+ Shto material</button>
    <div class="grid" style="margin-top:12px"><div><label id="lblVat">Moms (%)</label><input id="offerVat" type="number" value="25" min="0" step="1"></div></div>
    <div class="totalbox"><div><span id="subtotalLabel">Pa moms</span>: <b id="offerSubtotal">0 kr</b></div><div><span id="vatLabel">Moms</span>: <b id="offerVatAmount">0 kr</b></div><div><span id="totalLabel">TOTALI</span>: <b id="offerTotal">0 kr</b></div></div>
    <label id="lblOfferNotes">Shënime</label><textarea id="offerNotes"></textarea>
    <div class="row" style="margin-top:12px"><button id="saveOfferBtn" type="button">Ruaj ofertën</button><button id="cancelOfferBtn" class="secondary" type="button">Anulo</button></div>
    <button id="deleteOfferBtn" class="danger hidden" type="button" style="width:100%;margin-top:10px">Fshi ofertën</button>

<script>
'use strict';
const PROJECTS_KEY='iliri_maleri_projects_v3';
const HOURS_KEY='iliri_maleri_hours_v1';
const MATERIALS_KEY='iliri_maleri_materials_v1';
const LANG_KEY='iliri_maleri_lang_v4';
const OFFERS_KEY='iliri_maleri_offers_v1';

const I18N={
 sq:{langBtn:'SV',backup:'Backup',projects:'Projektet',clients:'Klientët',hours:'Orët',materials:'Materialet',newProject:'+ Projekt i ri',newProjectTitle:'Projekt i ri',project:'Projekti',date:'Data',projectName:'Emri i projektit',projectNumber:'Numri i projektit',client:'Klienti',phone:'Telefoni',address:'Adresa',workType:'Lloji i punës',chooseWork:'Zgjidh llojin e punës',status:'Statusi',active:'Aktiv',waiting:'Në pritje',done:'Mbaruar',offer:'Çmimi / oferta (kr)',notes:'Shënime',saveProject:'Ruaj projektin',cancel:'Anulo',back:'Kthehu',searchProject:'Kërko projekt',searchProjectPh:'Emër ose numër projekti...',searchClient:'Kërko klient',searchClientPh:'Emri i klientit...',start:'Fillimi',end:'Mbarimi',break:'Pushim (minuta)',saveHours:'Ruaj orët',material:'Materiali',cost:'Kosto (kr)',note:'Shënim',saveMaterial:'Ruaj materialin',restoreBackup:'Rikthe backup',editProject:'Ndrysho projektin',edit:'Ndrysho',deleteProject:'Fshi',deleteCurrentProject:'Fshi projektin',deleteConfirm:'Je i sigurt që dëshiron ta fshish këtë projekt?',noProjects:'Nuk ka projekte.',noClients:'Nuk ka klientë.',noHours:'Nuk ka orë të regjistruara.',noMaterials:'Nuk ka materiale të regjistruara.',hoursLower:'orë',breakLower:'pushim',backupRestored:'Backup u rikthye.',invalidBackup:'Backup i pavlefshëm.',offers:'OFERTA',newOffer:'+ Krijo ofertë të re',newOfferTitle:'Ofertë e re',editOffer:'Edito ofertën',offerNumber:'Nr. ofertës',offerSent:'E dërguar',offerAccepted:'E pranuar',offerPaid:'E paguar',all:'Të gjitha',workLines:'Punët',addWork:'+ Shto punë',addMaterial:'+ Shto material',description:'Përshkrimi',quantity:'Sasia',vat:'Moms (%)',subtotal:'Pa moms',total:'TOTALI',saveOffer:'Ruaj ofertën',deleteOffer:'Fshi ofertën',deleteOfferConfirm:'Je i sigurt që dëshiron ta fshish këtë ofertë?',noOffers:'Nuk ka oferta në këtë kategori.'},
 sv:{langBtn:'SQ',backup:'Backup',projects:'Projekt',clients:'Kunder',hours:'Timmar',materials:'Material',newProject:'+ Nytt projekt',newProjectTitle:'Nytt projekt',project:'Projekt',date:'Datum',projectName:'Projektnamn',projectNumber:'Projektnummer',client:'Kund',phone:'Telefon',address:'Adress',workType:'Typ av arbete',chooseWork:'Välj typ av arbete',status:'Status',active:'Aktiv',waiting:'Väntar',done:'Klar',offer:'Pris / offert (kr)',notes:'Anteckningar',saveProject:'Spara projekt',cancel:'Avbryt',back:'Tillbaka',searchProject:'Sök projekt',searchProjectPh:'Projektnamn eller nummer...',searchClient:'Sök kund',searchClientPh:'Kundens namn...',start:'Starttid',end:'Sluttid',break:'Rast (minuter)',saveHours:'Spara timmar',material:'Material',cost:'Kostnad (kr)',note:'Anteckning',saveMaterial:'Spara material',restoreBackup:'Återställ backup',editProject:'Redigera projekt',edit:'Redigera',deleteProject:'Ta bort',deleteCurrentProject:'Ta bort projektet',deleteConfirm:'Är du säker på att du vill ta bort projektet?',noProjects:'Inga projekt.',noClients:'Inga kunder.',noHours:'Inga registrerade timmar.',noMaterials:'Inga registrerade material.',hoursLower:'timmar',breakLower:'rast',backupRestored:'Backup återställd.',invalidBackup:'Ogiltig backup.',offers:'OFFERTER',newOffer:'+ Skapa ny offert',newOfferTitle:'Ny offert',editOffer:'Redigera offert',offerNumber:'Offertnummer',offerSent:'Skickad',offerAccepted:'Godkänd',offerPaid:'Betald',all:'Alla',workLines:'Arbeten',addWork:'+ Lägg till arbete',addMaterial:'+ Lägg till material',description:'Beskrivning',quantity:'Antal',vat:'Moms (%)',subtotal:'Exkl. moms',total:'TOTALT',saveOffer:'Spara offert',deleteOffer:'Ta bort offert',deleteOfferConfirm:'Är du säker på att du vill ta bort offerten?',noOffers:'Inga offerter i denna kategori.'}
};

let projects=load(PROJECTS_KEY,[]), hours=load(HOURS_KEY,[]), materials=load(MATERIALS_KEY,[]), offers=load(OFFERS_KEY,[]), currentLang=localStorage.getItem(LANG_KEY)||'sq';
let offerFilter='all';
function $(id){return document.getElementById(id)}
function load(k,d){try{const x=JSON.parse(localStorage.getItem(k));return Array.isArray(x)?x:d}catch(e){return d}}
function persistAll(){localStorage.setItem(PROJECTS_KEY,JSON.stringify(projects));localStorage.setItem(HOURS_KEY,JSON.stringify(hours));localStorage.setItem(MATERIALS_KEY,JSON.stringify(materials));localStorage.setItem(OFFERS_KEY,JSON.stringify(offers))}
function tr(k){return (I18N[currentLang]&&I18N[currentLang][k])||I18N.sq[k]||k}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function today(){const d=new Date();const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function statusText(s){return s==='done'?tr('done'):s==='waiting'?tr('waiting'):tr('active')}
function projectHours(id){return hours.filter(h=>h.projectId===id).reduce((a,b)=>a+Number(b.total||0),0)}
function projectMaterials(id){return materials.filter(m=>m.projectId===id).reduce((a,b)=>a+Number(m.cost||0),0)}

function showView(id){['homeView','projectFormView','projectsView','clientsView','hoursView','materialsView','offersView','offerFormView'].forEach(v=>$(v).classList.toggle('hidden',v!==id));if(id==='projectsView')renderProjects();if(id==='clientsView')renderClients();if(id==='hoursView')renderHours();if(id==='materialsView')renderMaterials();if(id==='offersView')renderOffers();window.scrollTo(0,0)}
function newProject(){clearProjectForm();showView('projectFormView')}
function clearProjectForm(){$('deleteCurrentProjectBtn').classList.add('hidden');['projectId','projectName','projectNumber','clientName','phone','address','price','notes'].forEach(id=>$(id).value='');$('type').value='';$('status').value='active';$('projectFormTitle').textContent=tr('newProjectTitle')}
function saveProject(){const id=$('projectId').value;const p={id:id||uid(),projectName:$('projectName').value.trim(),projectNumber:$('projectNumber').value.trim(),clientName:$('clientName').value.trim(),phone:$('phone').value.trim(),address:$('address').value.trim(),type:$('type').value,status:$('status').value,price:Number($('price').value||0),notes:$('notes').value.trim(),updatedAt:new Date().toISOString()};if(!p.projectName){$('projectName').focus();return}if(!p.projectNumber)p.projectNumber=String(projects.length+1).padStart(3,'0');const i=projects.findIndex(x=>x.id===p.id);if(i>=0)projects[i]=p;else projects.push(p);persistAll();refreshProjectSelectors();renderHome();showView('projectsView')}
function deleteProject(id){if(!confirm(tr('deleteConfirm')))return;projects=projects.filter(p=>p.id!==id);hours=hours.filter(h=>h.projectId!==id);materials=materials.filter(m=>m.projectId!==id);persistAll();refreshProjectSelectors();renderHome();renderProjects();renderClients()}
function editProject(id){const p=projects.find(x=>x.id===id);if(!p)return;$('deleteCurrentProjectBtn').classList.remove('hidden');$('projectId').value=p.id;$('projectName').value=p.projectName||'';$('projectNumber').value=p.projectNumber||'';$('clientName').value=p.clientName||'';$('phone').value=p.phone||'';$('address').value=p.address||'';$('type').value=p.type||'';$('status').value=p.status||'active';$('price').value=p.price||'';$('notes').value=p.notes||'';$('projectFormTitle').textContent=tr('editProject');showView('projectFormView')}
function toggleDetail(id){const el=$('detail-'+id);if(el)el.classList.toggle('hidden')}
function renderProjects(){const q=$('projectSearch').value.toLowerCase();const list=[...projects].sort((a,b)=>(a.projectNumber||'').localeCompare(b.projectNumber||'',undefined,{numeric:true})).filter(p=>[p.projectName,p.projectNumber,p.clientName].join(' ').toLowerCase().includes(q));$('projectsList').innerHTML=list.length?list.map(p=>`<div class="item clickable" data-detail="${esc(p.id)}"><h3>${esc(p.projectNumber||'')} — ${esc(p.projectName||'')}</h3><div class="meta">${tr('client')}: ${esc(p.clientName||'')} ${p.phone?'• '+esc(p.phone):''}</div><span class="badge">${statusText(p.status)}</span><div id="detail-${esc(p.id)}" class="detail hidden"><div class="meta"><b>${tr('address')}:</b> ${esc(p.address||'-')}<br><b>${tr('workType')}:</b> ${esc(p.type||'-')}<br><b>${tr('hours')}:</b> ${projectHours(p.id).toFixed(1)}<br><b>${tr('materials')}:</b> ${projectMaterials(p.id).toLocaleString('sv-SE')} kr<br><b>${tr('offer')}:</b> ${Number(p.price||0).toLocaleString('sv-SE')} kr<br><b>${tr('notes')}:</b> ${esc(p.notes||'-')}</div><div class="row" style="margin-top:10px"><button class="editProjectBtn" data-id="${esc(p.id)}" type="button">${tr('edit')}</button><button class="danger deleteProjectBtn" data-id="${esc(p.id)}" type="button">${tr('deleteProject')}</button></div></div></div>`).join(''):`<div class="empty">${tr('noProjects')}</div>`;document.querySelectorAll('[data-detail]').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('.editProjectBtn')||e.target.closest('.deleteProjectBtn'))return;toggleDetail(el.dataset.detail)}));document.querySelectorAll('.editProjectBtn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();editProject(b.dataset.id)}));document.querySelectorAll('.deleteProjectBtn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();deleteProject(b.dataset.id)}))}
function renderClients(){const q=$('clientSearch').value.toLowerCase();const map={};projects.forEach(p=>{const n=(p.clientName||'').trim();if(n){if(!map[n])map[n]=[];map[n].push(p)}});const names=Object.keys(map).sort((a,b)=>a.localeCompare(b,currentLang==='sv'?'sv-SE':'sq-AL')).filter(n=>n.toLowerCase().includes(q));$('clientsList').innerHTML=names.length?names.map(n=>`<div class="item"><h3>${esc(n)}</h3>${map[n].sort((a,b)=>(a.projectNumber||'').localeCompare(b.projectNumber||'',undefined,{numeric:true})).map(p=>`<div class="meta">${esc(p.projectNumber||'')} — ${esc(p.projectName||'')} ${p.phone?'• '+esc(p.phone):''}</div>`).join('')}</div>`).join(''):`<div class="empty">${tr('noClients')}</div>`}
function calcHours(start,end,br){if(!start||!end)return 0;const [sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number);let mins=(eh*60+em)-(sh*60+sm)-Number(br||0);if(mins<0)mins+=1440;return Math.max(0,mins/60)}
function saveHours(){const projectId=$('hoursProject').value;if(!projectId)return;const start=$('startTime').value,end=$('endTime').value,br=Number($('breakMinutes').value||0);hours.unshift({id:uid(),projectId,date:$('hoursDate').value||today(),start,end,breakMinutes:br,total:calcHours(start,end,br)});persistAll();renderHours();renderHome()}
function renderHours(){refreshProjectSelectors();const list=[...hours].sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('hoursList').innerHTML=list.length?list.map(h=>{const p=projects.find(x=>x.id===h.projectId)||{};return `<div class="item"><h3>${esc(h.date)} — ${Number(h.total||0).toFixed(1)} ${tr('hoursLower')}</h3><div class="meta">${esc(p.projectNumber||'')} — ${esc(p.projectName||'')}<br>${esc(h.start)}–${esc(h.end)} • ${tr('breakLower')} ${Number(h.breakMinutes||0)} min</div></div>`}).join(''):`<div class="empty">${tr('noHours')}</div>`}
function saveMaterial(){const projectId=$('materialProject').value;if(!projectId)return;materials.unshift({id:uid(),projectId,date:$('materialDate').value||today(),name:$('materialName').value.trim(),cost:Number($('materialCost').value||0),note:$('materialNote').value.trim()});persistAll();$('materialName').value='';$('materialCost').value='';$('materialNote').value='';renderMaterials();renderHome()}
function renderMaterials(){refreshProjectSelectors();$('materialsList').innerHTML=materials.length?materials.map(m=>{const p=projects.find(x=>x.id===m.projectId)||{};return `<div class="item"><h3>${esc(m.name||tr('material'))} — ${Number(m.cost||0).toLocaleString('sv-SE')} kr</h3><div class="meta">${esc(m.date)} • ${esc(p.projectNumber||'')} — ${esc(p.projectName||'')} ${m.note?'<br>'+esc(m.note):''}</div></div>`}).join(''):`<div class="empty">${tr('noMaterials')}</div>`}
function refreshProjectSelectors(){const opts=projects.map(p=>`<option value="${esc(p.id)}">${esc(p.projectNumber||'')} — ${esc(p.projectName||'')}</option>`).join('');$('hoursProject').innerHTML=opts;$('materialProject').innerHTML=opts}
function renderHome(){$('countProjects').textContent=projects.length;$('countClients').textContent=new Set(projects.map(p=>(p.clientName||'').trim()).filter(Boolean)).size;$('countHours').textContent=hours.reduce((a,b)=>a+Number(b.total||0),0).toFixed(1)}
function offerStatusText(s){return s==='accepted'?tr('offerAccepted'):s==='paid'?tr('offerPaid'):tr('offerSent')}
function nextOfferNumber(){const y=new Date().getFullYear();return `${y}-${String(offers.length+1).padStart(3,'0')}`}
function addOfferLine(kind,data={}){const box=$(kind==='work'?'workLines':'materialLines');const row=document.createElement('div');row.className='offer-line '+(kind==='material'?'material-line':'');row.dataset.kind=kind;if(kind==='work')row.innerHTML=`<input class="desc" placeholder="${esc(tr('description'))}" value="${esc(data.description||'')}"><input class="qty" type="number" min="0" step="0.5" placeholder="${esc(tr('hoursLower'))}" value="${esc(data.qty??'')}"><input class="unitPrice" type="number" min="0" step="1" placeholder="kr/${esc(tr('hoursLower'))}" value="${esc(data.unitPrice??'')}"><button class="danger removeLine" type="button">×</button>`;else row.innerHTML=`<input class="desc" placeholder="${esc(tr('material'))}" value="${esc(data.description||'')}"><input class="qty" type="number" min="0" step="1" placeholder="${esc(tr('quantity'))}" value="${esc(data.qty??'')}"><input class="unitPrice" type="number" min="0" step="1" placeholder="kr" value="${esc(data.unitPrice??'')}"><button class="danger removeLine" type="button">×</button>`;box.appendChild(row);row.querySelectorAll('input').forEach(x=>x.addEventListener('input',calcOffer));row.querySelector('.removeLine').addEventListener('click',()=>{row.remove();calcOffer()});calcOffer()}
function collectOfferLines(kind){return [...$(kind==='work'?'workLines':'materialLines').querySelectorAll('.offer-line')].map(r=>({description:r.querySelector('.desc').value.trim(),qty:Number(r.querySelector('.qty').value||0),unitPrice:Number(r.querySelector('.unitPrice').value||0)})).filter(x=>x.description||x.qty||x.unitPrice)}
function calcOffer(){const lines=[...collectOfferLines('work'),...collectOfferLines('material')];const subtotal=lines.reduce((a,x)=>a+x.qty*x.unitPrice,0);const vatPct=Number($('offerVat').value||0);const vat=subtotal*vatPct/100;const fmt=n=>Number(n).toLocaleString('sv-SE',{maximumFractionDigits:2})+' kr';$('offerSubtotal').textContent=fmt(subtotal);$('offerVatAmount').textContent=fmt(vat);$('offerTotal').textContent=fmt(subtotal+vat);return{subtotal,vat,total:subtotal+vat}}
function clearOfferForm(){$('offerId').value='';$('offerNumber').value=nextOfferNumber();$('offerDate').value=today();$('offerClient').value='';$('offerPhone').value='';$('offerAddress').value='';$('offerStatus').value='sent';$('offerVat').value='25';$('offerNotes').value='';$('workLines').innerHTML='';$('materialLines').innerHTML='';addOfferLine('work');addOfferLine('material');$('deleteOfferBtn').classList.add('hidden');$('offerFormTitle').textContent=tr('newOfferTitle');calcOffer()}
function newOffer(){clearOfferForm();showView('offerFormView')}
function saveOffer(){const id=$('offerId').value;const totals=calcOffer();const o={id:id||uid(),number:$('offerNumber').value.trim()||nextOfferNumber(),date:$('offerDate').value||today(),client:$('offerClient').value.trim(),phone:$('offerPhone').value.trim(),address:$('offerAddress').value.trim(),status:$('offerStatus').value,work:collectOfferLines('work'),materials:collectOfferLines('material'),vatPct:Number($('offerVat').value||0),notes:$('offerNotes').value.trim(),...totals,updatedAt:new Date().toISOString()};if(!o.client){$('offerClient').focus();return}const i=offers.findIndex(x=>x.id===o.id);if(i>=0)offers[i]=o;else offers.unshift(o);persistAll();showView('offersView')}
function editOffer(id){const o=offers.find(x=>x.id===id);if(!o)return;$('offerId').value=o.id;$('offerNumber').value=o.number||'';$('offerDate').value=o.date||today();$('offerClient').value=o.client||'';$('offerPhone').value=o.phone||'';$('offerAddress').value=o.address||'';$('offerStatus').value=o.status||'sent';$('offerVat').value=o.vatPct??25;$('offerNotes').value=o.notes||'';$('workLines').innerHTML='';$('materialLines').innerHTML='';(o.work||[]).forEach(x=>addOfferLine('work',x));(o.materials||[]).forEach(x=>addOfferLine('material',x));if(!(o.work||[]).length)addOfferLine('work');if(!(o.materials||[]).length)addOfferLine('material');$('deleteOfferBtn').classList.remove('hidden');$('offerFormTitle').textContent=tr('editOffer');calcOffer();showView('offerFormView')}
function deleteOffer(id){if(!confirm(tr('deleteOfferConfirm')))return;offers=offers.filter(o=>o.id!==id);persistAll();showView('offersView')}
function renderOffers(){const list=offers.filter(o=>offerFilter==='all'||o.status===offerFilter);$('offersList').innerHTML=list.length?list.map(o=>`<div class="item"><div class="section-title"><h3>${esc(o.number||'')} — ${esc(o.client||'')}</h3><span class="badge offer-status">${offerStatusText(o.status)}</span></div><div class="meta">${esc(o.date||'')} ${o.address?'• '+esc(o.address):''}<br><b>${tr('total')}:</b> ${Number(o.total||0).toLocaleString('sv-SE',{maximumFractionDigits:2})} kr</div><div class="row" style="margin-top:10px"><button class="editOfferBtn" data-id="${esc(o.id)}" type="button">${tr('edit')}</button><button class="danger deleteOfferListBtn" data-id="${esc(o.id)}" type="button">${tr('deleteProject')}</button></div></div>`).join(''):`<div class="empty">${tr('noOffers')}</div>`;document.querySelectorAll('.editOfferBtn').forEach(b=>b.addEventListener('click',()=>editOffer(b.dataset.id)));document.querySelectorAll('.deleteOfferListBtn').forEach(b=>b.addEventListener('click',()=>deleteOffer(b.dataset.id)))}
function exportBackup(){const blob=new Blob([JSON.stringify({version:5,projects,hours,materials,offers},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='iliri-maleri-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBackup(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);projects=Array.isArray(d.projects)?d.projects:[];hours=Array.isArray(d.hours)?d.hours:[];materials=Array.isArray(d.materials)?d.materials:[];offers=Array.isArray(d.offers)?d.offers:[];persistAll();refreshProjectSelectors();renderHome();alert(tr('backupRestored'))}catch(e){alert(tr('invalidBackup'))}};r.readAsText(file)}
function setText(id,key){const el=$(id);if(el)el.textContent=tr(key)}
function applyLang(){document.documentElement.lang=currentLang;setText('langBtn','langBtn');setText('backupBtn','backup');setText('btnProjects','projects');setText('btnClients','clients');setText('btnHours','hours');setText('btnMaterials','materials');setText('btnNewProject','newProject');setText('statProjects','projects');setText('statClients','clients');setText('statHours','hours');setText('lblProjectName','projectName');setText('lblProjectNumber','projectNumber');setText('lblClient','client');setText('lblPhone','phone');setText('lblAddress','address');setText('lblType','workType');setText('lblStatus','status');setText('lblPrice','offer');setText('lblNotes','notes');setText('saveProjectBtn','saveProject');setText('cancelProjectBtn','cancel');setText('deleteCurrentProjectBtn','deleteCurrentProject');setText('projectsTitle','projects');setText('clientsTitle','clients');setText('hoursTitle','hours');setText('materialsTitle','materials');setText('lblSearchProject','searchProject');setText('lblSearchClient','searchClient');$('projectSearch').placeholder=tr('searchProjectPh');$('clientSearch').placeholder=tr('searchClientPh');document.querySelectorAll('.backBtn').forEach(el=>el.textContent=tr('back'));document.querySelectorAll('.lblProject').forEach(el=>el.textContent=tr('project'));document.querySelectorAll('.lblDate').forEach(el=>el.textContent=tr('date'));setText('lblStart','start');setText('lblEnd','end');setText('lblBreak','break');setText('saveHoursBtn','saveHours');setText('lblMaterialName','material');setText('lblMaterialCost','cost');setText('lblMaterialNote','note');setText('saveMaterialBtn','saveMaterial');setText('restoreBackupTitle','restoreBackup');$('type').options[0].textContent=tr('chooseWork');$('status').options[0].textContent=tr('active');$('status').options[1].textContent=tr('waiting');$('status').options[2].textContent=tr('done');$('projectFormTitle').textContent=$('projectId').value?tr('editProject'):tr('newProjectTitle');setText('btnOffers','offers');setText('offersTitle','offers');setText('newOfferBtn','newOffer');setText('filterSent','offerSent');setText('filterAccepted','offerAccepted');setText('filterPaid','offerPaid');setText('filterAll','all');setText('lblOfferNumber','offerNumber');setText('lblOfferDate','date');setText('lblOfferClient','client');setText('lblOfferPhone','phone');setText('lblOfferAddress','address');setText('lblOfferStatus','status');setText('workLinesTitle','workLines');setText('materialLinesTitle','materials');setText('addWorkLineBtn','addWork');setText('addMaterialLineBtn','addMaterial');setText('lblVat','vat');setText('subtotalLabel','subtotal');setText('vatLabel','vat');setText('totalLabel','total');setText('lblOfferNotes','notes');setText('saveOfferBtn','saveOffer');setText('cancelOfferBtn','cancel');setText('deleteOfferBtn','deleteOffer');document.querySelectorAll('.backToOffersBtn').forEach(el=>el.textContent=tr('back'));$('offerStatus').options[0].textContent=tr('offerSent');$('offerStatus').options[1].textContent=tr('offerAccepted');$('offerStatus').options[2].textContent=tr('offerPaid');$('offerFormTitle').textContent=$('offerId').value?tr('editOffer'):tr('newOfferTitle');renderHome();if(!$('projectsView').classList.contains('hidden'))renderProjects();if(!$('clientsView').classList.contains('hidden'))renderClients();if(!$('hoursView').classList.contains('hidden'))renderHours();if(!$('materialsView').classList.contains('hidden'))renderMaterials();if(!$('offersView').classList.contains('hidden'))renderOffers()}
function toggleLang(){currentLang=currentLang==='sq'?'sv':'sq';localStorage.setItem(LANG_KEY,currentLang);applyLang()}

function bind(){
 $('langBtn').addEventListener('click',toggleLang);
 $('backupBtn').addEventListener('click',exportBackup);
 $('btnOffers').addEventListener('click',()=>showView('offersView'));
 $('newOfferBtn').addEventListener('click',newOffer);
 document.querySelectorAll('.offerFilter').forEach(b=>b.addEventListener('click',()=>{offerFilter=b.dataset.status;renderOffers()}));
 $('addWorkLineBtn').addEventListener('click',()=>addOfferLine('work'));
 $('addMaterialLineBtn').addEventListener('click',()=>addOfferLine('material'));
 $('offerVat').addEventListener('input',calcOffer);
 $('saveOfferBtn').addEventListener('click',saveOffer);
 $('cancelOfferBtn').addEventListener('click',()=>showView('offersView'));
 document.querySelectorAll('.backToOffersBtn').forEach(b=>b.addEventListener('click',()=>showView('offersView')));
 $('deleteOfferBtn').addEventListener('click',()=>{const id=$('offerId').value;if(id)deleteOffer(id)});
 $('btnProjects').addEventListener('click',()=>showView('projectsView'));
 $('btnClients').addEventListener('click',()=>showView('clientsView'));
 $('btnHours').addEventListener('click',()=>showView('hoursView'));
 $('btnMaterials').addEventListener('click',()=>showView('materialsView'));
 $('btnNewProject').addEventListener('click',newProject);
 $('statProjectsCard').addEventListener('click',()=>showView('projectsView'));
 $('statClientsCard').addEventListener('click',()=>showView('clientsView'));
 $('statHoursCard').addEventListener('click',()=>showView('hoursView'));
 document.querySelectorAll('.backBtn').forEach(b=>b.addEventListener('click',()=>showView('homeView')));
 $('saveProjectBtn').addEventListener('click',saveProject);
 $('cancelProjectBtn').addEventListener('click',()=>{clearProjectForm();showView('homeView')});
 $('deleteCurrentProjectBtn').addEventListener('click',()=>{const id=$('projectId').value;if(id)deleteProject(id);clearProjectForm();showView('projectsView')});
 $('projectSearch').addEventListener('input',renderProjects);
 $('clientSearch').addEventListener('input',renderClients);
 $('saveHoursBtn').addEventListener('click',saveHours);
 $('saveMaterialBtn').addEventListener('click',saveMaterial);
 $('importFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)importBackup(f)});
}

document.addEventListener('DOMContentLoaded',()=>{
 $('hoursDate').value=today();$('materialDate').value=today();refreshProjectSelectors();bind();applyLang();renderHome();
});
</script>
</body>
</html>
